services:
  core-api:
    build: ./services/core-api
    container_name: broken-design-core-api
    ports:
      - "4000:4000"
    env_file:
      - path: ./services/core-api/.env.example
        required: false
      - path: ./services/core-api/.env
        required: false
    restart: unless-stopped

  cdn-service:
    build: ./services/cdn-service
    container_name: broken-design-cdn-service
    ports:
      - "4001:4001"
    env_file:
      - path: ./services/cdn-service/.env.example
        required: false
      - path: ./services/cdn-service/.env
        required: false
    volumes:
      - broken_design_storage:/app/storage_data
      - broken_design_tmp:/app/tmp_uploads
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: broken-design-frontend
    ports:
      - "3000:3000"
    env_file:
      - path: ./frontend/.env.example
        required: false
      - path: ./frontend/.env.local
        required: false
    environment:
      - INTERNAL_CORE_API_URL=http://core-api:4000
    depends_on:
      - core-api
      - cdn-service
    restart: unless-stopped

volumes:
  broken_design_storage:
  broken_design_tmp:
